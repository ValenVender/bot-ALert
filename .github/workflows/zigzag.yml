name: ZigZag PA Alert

on:
  schedule:
    - cron: "5 * * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Kirim pesan tes ke Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: zigzag-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Jalankan alert
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOLS: ${{ vars.SYMBOLS || 'GC=F' }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python zigzag_alert.py --test
          else
            python zigzag_alert.py
          fi

      - name: Simpan state (anti notif dobel)
        run: |
          git config user.name "zigzag-bot"
          git config user.email "zigzag-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
